[package]
name = "skillbox"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Agent-agnostic CLI for discovering and loading focused coding-agent skills"
repository = "https://github.com/hhushhas/skillbox"
homepage = "https://skillbox.hasanshoaib.com"
readme = "README.md"
exclude = ["npm/**", "site/**", ".github/**", "scratchpad/**"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
flate2 = "1.0"
fs2 = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.0"
serde_json = "1.0"
serde_yaml = "0.9"
tar = "0.4"
tempfile = "3.14"
